<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Splash CSS</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- SPLASH -->
  <div class="splash">
    <img src="./img/kario sin kairo.svg" alt="">
  </div>

  <!-- CONTENIDO -->

  <!-- Log in de inicio -->
   <main class="content">
        <div class="background-overlay">
        <div class="login-card">
            <div class="logo-container">
                <img src="/img/kario sin kairo.svg" alt="KARIO Logo" class="logo-icon">
                <p class="logo-text">MEDIA</p>
            </div>

            <h1>Bienvenido al panel digital de <br> <span>KARIO Media</span></h1>
            <p class="subtitle">Por favor ingresa los siguientes datos para ingresar a la plataforma</p>

            <form>
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario">
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password">
                </div>

                <a href="/pages/PanelBienvenida.html" class="btn-primary" >Ingresar al panel</a>
            </form>

            <p class="footer-text">
                ¿Tienes problemas para ingresar? Por favor contactarse con asistencia técnica lo más pronto posible
            </p>
        </div>
    </div>
   </main>

</body>
</html>
