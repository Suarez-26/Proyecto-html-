<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>INICIO - MEDIA</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- SPLASH -->
  <div class="pantalla-carga">
    <img src="./img/kario sin kairo.svg" alt="">
  </div>

  <!-- CONTENIDO -->
  <main class="contenido">
    <div class="capa-fondo">
      <div class="tarjeta-login">
        <div class="contenedor-logo">
          <img src="/img/kario sin kairo.svg" alt="KARIO Logo" class="icono-logo">
          <p class="texto-logo">MEDIA</p>
        </div>

        <h1>Bienvenido al panel digital de <br> <span>KARIO Media</span></h1>
        <p class="subtitulo">
          Por favor ingresa los siguientes datos para ingresar a la plataforma
        </p>

        <form>
          <div class="grupo-input">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario">
          </div>

          <div class="grupo-input">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password">
          </div>

          <a href="/pages/PanelBienvenida.html" class="boton-principal">
            Ingresar al panel
          </a>
        </form>

        <p class="texto-footer">
          ¿Tienes problemas para ingresar? Por favor contactarse con asistencia técnica lo más pronto posible
        </p>
      </div>
    </div>
  </main>

</body>
</html>
